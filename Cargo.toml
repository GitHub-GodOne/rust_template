[workspace]

[package]
name = "gpt_images"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "gpt_images-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "0.16" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml = { version = "0.9" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "process",
  "fs",
  "io-util",
  "time",
  "net",
] }
async-trait = { version = "0.1" }
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "sqlx-mysql",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
include_dir = { version = "0.7" }
axum-extra = { version = "0.10", features = ["form"] }
sha2 = { version = "0.10" }
hex = { version = "0.4" }
base64 = { version = "0.22" }
ring = { version = "0.17" }
utoipa = { version = "5", features = ["chrono", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "multipart", "rustls-tls", "socks"] }
object_store = { version = "0.11", features = ["aws"] }
sysinfo = { version = "0.33" }
portable-pty = { version = "0.8" }
futures-util = { version = "0.3" }
tower-http = { version = "0.6", features = ["compression-full"] }
mime_guess = { version = "2.0" }
url = { version = "2.5" }
same-file = { version = "1.0" }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14" }
x509-parser = { version = "0.18" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client-legacy", "http1", "http2"] }
http-body-util = { version = "0.1" }
socket2 = { version = "0.6" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# WASAPI loopback capture for 远程音频 (Linux records through `parec` instead).
cpal = "0.15"
encoding_rs = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[[bin]]
name = "gpt_images-cli"
path = "src/bin/main.rs"
required-features = []

# A/B copies of the same CLI: the service runs one while the other is rebuilt,
# e.g. `cargo build --release --bin gpt_images-cli-b`, then switch the service
# over with `target/release/gpt_images-cli-b service install`.
[[bin]]
name = "gpt_images-cli-a"
path = "src/bin/gpt_images-cli-a.rs"
required-features = []

[[bin]]
name = "gpt_images-cli-b"
path = "src/bin/gpt_images-cli-b.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
